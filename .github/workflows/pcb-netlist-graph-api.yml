name: PCB Netlist Graph API CI

on:
  push:
    branches: [main]
    paths: [pcb_netlist_graph_api/**]
  pull_request:
    branches: [main]
    paths: [pcb_netlist_graph_api/**]

defaults:
  run:
    working-directory: pcb_netlist_graph_api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check catalog/ tests/ pcb_api/
      - run: uv run ruff format --check catalog/ tests/ pcb_api/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run mypy catalog/ pcb_api/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcb
          POSTGRES_PASSWORD: pcb
          POSTGRES_DB: pcbdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - name: Run 20 pytest-django tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: pcb
          POSTGRES_PASSWORD: pcb
          POSTGRES_DB: pcbdb
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/ -v --tb=short
